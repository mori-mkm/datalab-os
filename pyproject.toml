[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-os"
version = "0.1.0"
description = "DataLab OS: a local-first, hierarchical agentic data science workflow with a live control plane."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "PyYAML>=6",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
